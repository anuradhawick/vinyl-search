<app-loader [loading]="loading"></app-loader>
@if (!loading) {
  <app-records-editor-component
    [record]="record"
    [editorTitle]="
      isRevisionSubmission ? record && record.name : 'New Release Details'
    "
    #editor
    (readyStateChange)="readyChange($event)"
  ></app-records-editor-component>
  @if (isRevisionSubmission) {
    <div class="w-full">
      <div class="relative md:left-1/3 md:w-2/3 gap-1 p-2">
        <mat-form-field class="w-full">
          <textarea
            matInput
            placeholder="Revision comments"
            [formControl]="revisionComments"
            required
          >
          </textarea>
          <mat-error>
            Please enter a comment describing your revision
          </mat-error>
        </mat-form-field>
      </div>
    </div>
  }
  <div class="w-full">
    <div class="relative md:left-1/3 flex flex-row gap-1 p-2">
      <button mat-raised-button [routerLink]="['/records']" [disabled]="!ready">
        Discard
      </button>
      <button
        mat-raised-button
        color="primary"
        (click)="save()"
        [disabled]="!ready"
      >
        {{ isRevisionSubmission ? "Update" : "Save" }}
      </button>
    </div>
  </div>
  <br />
}
